# InsightForge Evaluation Suite - Golden Questions Dataset
# 93 Evaluation questions:
# - 48 Domain-specific across 9 core intents (category, state, seller, delivery, payment, trend, KPIs, data quality, anomalies)
# - 10 Out-of-scope questions (should resolve to unknown / confidence < 0.60)
# - 5 Ambiguous queries
# - 30 Dynamic Guarded Text-to-SQL benchmark queries evaluated against real PostgreSQL

