  # ----------------------------------------------------------------------------
  # Dynamic Guarded Text-to-SQL (30 questions)
  # Ground truth expected values are computed from live PostgreSQL via reference_sql
  # ----------------------------------------------------------------------------
  - id: sql_01
    question: "Total product revenue generated from delivered orders in Rio de Janeiro (RJ)?"
    reference_sql: "SELECT ROUND(SUM(oi.price), 2) AS total_revenue FROM orders o JOIN order_items oi ON o.order_id = oi.order_id JOIN customers c ON o.customer_id = c.customer_id WHERE o.order_status = 'delivered' AND c.customer_state = 'RJ';"
    expected_intent: "text_to_sql"
    description: "Regional filter by RJ state for delivered product sales"

  - id: sql_02
    question: "What was the total gross revenue in the year 2017?"
    reference_sql: "SELECT ROUND(SUM(gross_order_amount), 2) AS gross_revenue FROM view_order_level_summary WHERE order_status = 'delivered' AND order_purchase_timestamp >= '2017-01-01' AND order_purchase_timestamp < '2018-01-01';"
    expected_intent: "text_to_sql"
    description: "Time bound annual revenue aggregation for 2017"

  - id: sql_03
    question: "How many unique customers made delivered purchases from Minas Gerais (MG)?"
    reference_sql: "SELECT COUNT(DISTINCT c.customer_unique_id) AS unique_customers FROM orders o JOIN customers c ON o.customer_id = c.customer_id WHERE o.order_status = 'delivered' AND c.customer_state = 'MG';"
    expected_intent: "text_to_sql"
    description: "Unique customer count in MG state"

  - id: sql_04
    question: "Total units sold in the health_beauty category?"
    reference_sql: "SELECT COUNT(oi.order_item_id) AS units_sold FROM orders o JOIN order_items oi ON o.order_id = oi.order_id JOIN products p ON oi.product_id = p.product_id WHERE o.order_status = 'delivered' AND p.product_category_name_english = 'health_beauty';"
    expected_intent: "text_to_sql"
    description: "Category unit volume count"

  - id: sql_05
    question: "What is the average freight value across delivered orders in 2018?"
    reference_sql: "SELECT ROUND(AVG(total_freight_amount), 2) AS avg_freight FROM view_order_level_summary WHERE order_status = 'delivered' AND order_purchase_timestamp >= '2018-01-01';"
    expected_intent: "text_to_sql"
    description: "Average freight cost filter for 2018"

  - id: sql_06
    question: "How many delivered orders were paid using credit card?"
    reference_sql: "SELECT COUNT(DISTINCT o.order_id) AS order_count FROM orders o JOIN order_payments op ON o.order_id = op.order_id WHERE o.order_status = 'delivered' AND op.payment_type = 'credit_card';"
    expected_intent: "text_to_sql"
    description: "Delivered orders with credit card payment method"

  - id: sql_07
    question: "What is the highest single product item price sold in a delivered order?"
    reference_sql: "SELECT MAX(oi.price) AS max_price FROM orders o JOIN order_items oi ON o.order_id = oi.order_id WHERE o.order_status = 'delivered';"
    expected_intent: "text_to_sql"
    description: "Maximum product price"

  - id: sql_08
    question: "How many sellers are located in the state of Sao Paulo (SP)?"
    reference_sql: "SELECT COUNT(DISTINCT seller_id) AS seller_count FROM sellers WHERE seller_state = 'SP';"
    expected_intent: "text_to_sql"
    description: "Seller geographic count in SP"

  - id: sql_09
    question: "What is the average review score for delivered orders in watches_gifts category?"
    reference_sql: "SELECT ROUND(AVG(r.review_score), 2) AS avg_csat FROM orders o JOIN order_items oi ON o.order_id = oi.order_id JOIN products p ON oi.product_id = p.product_id JOIN order_reviews r ON o.order_id = r.order_id WHERE o.order_status = 'delivered' AND p.product_category_name_english = 'watches_gifts';"
    expected_intent: "text_to_sql"
    description: "CSAT review score for watches category"

  - id: sql_10
    question: "Total gross revenue generated by orders in August 2017?"
    reference_sql: "SELECT ROUND(SUM(gross_revenue), 2) AS revenue FROM view_monthly_kpis_mom WHERE sales_month = '2017-08-01';"
    expected_intent: "text_to_sql"
    description: "Specific month revenue lookup"

  - id: sql_11
    question: "How many delivered orders experienced a delivery delay?"
    reference_sql: "SELECT COUNT(*) AS delayed_orders FROM orders WHERE order_status = 'delivered' AND order_delivered_customer_date > order_estimated_delivery_date;"
    expected_intent: "text_to_sql"
    description: "Logistics SLA delayed order count"

  - id: sql_12
    question: "Average number of installments for credit card payments?"
    reference_sql: "SELECT ROUND(AVG(payment_installments), 2) AS avg_installments FROM order_payments WHERE payment_type = 'credit_card';"
    expected_intent: "text_to_sql"
    description: "Installment average"

  - id: sql_13
    question: "What was the total freight revenue collected in Bahia (BA) state?"
    reference_sql: "SELECT ROUND(SUM(oi.freight_value), 2) AS freight_ba FROM orders o JOIN order_items oi ON o.order_id = oi.order_id JOIN customers c ON o.customer_id = c.customer_id WHERE o.order_status = 'delivered' AND c.customer_state = 'BA';"
    expected_intent: "text_to_sql"
    description: "Freight sum for BA state"

  - id: sql_14
    question: "How many unique products are offered in computers_accessories category?"
    reference_sql: "SELECT COUNT(DISTINCT product_id) AS product_count FROM products WHERE product_category_name_english = 'computers_accessories';"
    expected_intent: "text_to_sql"
    description: "Catalog product count for computers accessories"

  - id: sql_15
    question: "What was the average order value (AOV) for delivered orders in 2017?"
    reference_sql: "SELECT ROUND(SUM(gross_order_amount) / COUNT(DISTINCT order_id), 2) AS aov_2017 FROM view_order_level_summary WHERE order_status = 'delivered' AND order_purchase_timestamp >= '2017-01-01' AND order_purchase_timestamp < '2018-01-01';"
    expected_intent: "text_to_sql"
    description: "AOV for calendar year 2017"

  - id: sql_16
    question: "Total number of orders canceled in the dataset?"
    reference_sql: "SELECT COUNT(*) AS canceled_count FROM orders WHERE order_status = 'canceled';"
    expected_intent: "text_to_sql"
    description: "Canceled status order count"

  - id: sql_17
    question: "What is the total product sales revenue (price only) of the top 3 highest earning sellers combined?"
    reference_sql: "SELECT ROUND(SUM(total_sales_revenue), 2) AS top3_revenue FROM (SELECT total_sales_revenue FROM view_seller_performance ORDER BY total_sales_revenue DESC LIMIT 3) sub;"
    expected_intent: "text_to_sql"
    description: "Top-3 seller revenue aggregate"

  - id: sql_18
    question: "How many orders were delivered on-time in the state of Santa Catarina (SC)?"
    reference_sql: "SELECT COUNT(o.order_id) AS on_time_orders FROM orders o JOIN customers c ON o.customer_id = c.customer_id WHERE o.order_status = 'delivered' AND c.customer_state = 'SC' AND o.order_delivered_customer_date <= o.order_estimated_delivery_date;"
    expected_intent: "text_to_sql"
    description: "On-time delivery filter for SC"

  - id: sql_19
    question: "What is the average review score of 1-installment credit card purchases?"
    reference_sql: "SELECT ROUND(AVG(r.review_score), 2) AS csat_1inst FROM orders o JOIN order_payments op ON o.order_id = op.order_id JOIN order_reviews r ON o.order_id = r.order_id WHERE o.order_status = 'delivered' AND op.payment_type = 'credit_card' AND op.payment_installments = 1;"
    expected_intent: "text_to_sql"
    description: "Review score on 1-installment orders"

  - id: sql_20
    question: "Total product revenue generated by sellers located in Parana (PR)?"
    reference_sql: "SELECT ROUND(SUM(oi.price), 2) AS pr_seller_rev FROM orders o JOIN order_items oi ON o.order_id = oi.order_id JOIN sellers s ON oi.seller_id = s.seller_id WHERE o.order_status = 'delivered' AND s.seller_state = 'PR';"
    expected_intent: "text_to_sql"
    description: "Seller state revenue aggregation"

  - id: sql_21
    question: "What is the minimum item price among delivered items?"
    reference_sql: "SELECT MIN(price) AS min_price FROM order_items oi JOIN orders o ON oi.order_id = o.order_id WHERE o.order_status = 'delivered';"
    expected_intent: "text_to_sql"
    description: "Minimum item price"

  - id: sql_22
    question: "How many delivered orders contained 3 or more items?"
    reference_sql: "SELECT COUNT(*) AS multi_item_orders FROM view_order_level_summary WHERE order_status = 'delivered' AND item_count >= 3;"
    expected_intent: "text_to_sql"
    description: "Multi-item order count"

  - id: sql_23
    question: "What is the total payment value paid via boleto bancario?"
    reference_sql: "SELECT ROUND(SUM(payment_value), 2) AS boleto_total FROM order_payments WHERE payment_type = 'boleto';"
    expected_intent: "text_to_sql"
    description: "Boleto total payment value"

  - id: sql_24
    question: "Average delivery duration in days for orders delivered to Rio Grande do Sul (RS)?"
    reference_sql: "SELECT ROUND(AVG(EXTRACT(EPOCH FROM (o.order_delivered_customer_date - o.order_purchase_timestamp)) / 86400.0), 2) AS avg_days_rs FROM orders o JOIN customers c ON o.customer_id = c.customer_id WHERE o.order_status = 'delivered' AND c.customer_state = 'RS' AND o.order_delivered_customer_date IS NOT NULL;"
    expected_intent: "text_to_sql"
    description: "Logistics duration for RS state"

  - id: sql_25
    question: "How many unique customer cities are represented in Sao Paulo (SP) state?"
    reference_sql: "SELECT COUNT(DISTINCT customer_city) AS city_count FROM customers WHERE customer_state = 'SP';"
    expected_intent: "text_to_sql"
    description: "Unique city count in SP"

  - id: sql_26
    question: "What was the total product revenue in bed_bath_table category?"
    reference_sql: "SELECT total_revenue FROM view_category_contribution WHERE category_name = 'bed_bath_table';"
    expected_intent: "text_to_sql"
    description: "Bed bath table category total revenue"

  - id: sql_27
    question: "What is the average product weight in grams across the catalog?"
    reference_sql: "SELECT ROUND(AVG(product_weight_g), 1) AS avg_weight FROM products WHERE product_weight_g IS NOT NULL;"
    expected_intent: "text_to_sql"
    description: "Average catalog product weight"

  - id: sql_28
    question: "How many orders were paid using vouchers?"
    reference_sql: "SELECT COUNT(DISTINCT order_id) AS voucher_orders FROM order_payments WHERE payment_type = 'voucher';"
    expected_intent: "text_to_sql"
    description: "Voucher order count"

  - id: sql_29
    question: "Total revenue contribution percentage of the top product category?"
    reference_sql: "SELECT revenue_contribution_pct FROM view_category_contribution ORDER BY total_revenue DESC LIMIT 1;"
    expected_intent: "text_to_sql"
    description: "Top category contribution percent"

  - id: sql_30
    question: "What is the average review score for delayed delivered orders?"
    reference_sql: "SELECT ROUND(AVG(r.review_score), 2) AS delayed_csat FROM orders o JOIN order_reviews r ON o.order_id = r.order_id WHERE o.order_status = 'delivered' AND o.order_delivered_customer_date > o.order_estimated_delivery_date;"
    expected_intent: "text_to_sql"
    description: "CSAT score on delayed orders"

