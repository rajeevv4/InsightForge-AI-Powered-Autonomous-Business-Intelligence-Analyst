  # ----------------------------------------------------------------------------
  # Ambiguous Queries (5 questions)
  # Can resolve to reasonable default intent or unknown
  # ----------------------------------------------------------------------------
  - id: amb_01
    question: "Tell me about the business performance."
    expected_intent: "kpi_summary"
    description: "Broad business query (routes to executive KPIs)"

  - id: amb_02
    question: "How are things looking right now?"
    expected_intent: "unknown"
    description: "Completely vague question"

  - id: amb_03
    question: "Can you show me the numbers?"
    expected_intent: "unknown"
    description: "Unspecified metrics request"

  - id: amb_04
    question: "Give me an overview of everything."
    expected_intent: "kpi_summary"
    description: "Overview request"

  - id: amb_05
    question: "What is happening with our growth?"
    expected_intent: "revenue_trend"
    description: "Growth query (routes to revenue trends)"
