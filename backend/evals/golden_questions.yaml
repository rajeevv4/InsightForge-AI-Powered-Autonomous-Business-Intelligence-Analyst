# InsightForge Evaluation Suite - Golden Questions Dataset
# 63 Evaluation questions:
# - 48 Domain-specific across 9 core intents (category, state, seller, delivery, payment, trend, KPIs, data quality, anomalies)
# - 10 Out-of-scope questions (should resolve to unknown / confidence < 0.60)
# - 5 Ambiguous queries

questions:
  # ----------------------------------------------------------------------------
  # Category Analysis (5 questions)
  # ----------------------------------------------------------------------------
  - id: cat_01
    question: "Which product category generated the highest revenue?"
    expected_intent: "category_analysis"
    expected_value: 1258819.00
    description: "Top revenue category check (cama_mesa_banho / bed_bath_table or health_beauty)"

  - id: cat_02
    question: "What are our top product categories by sales and revenue?"
    expected_intent: "category_analysis"
    description: "Category sales breakdown request"

  - id: cat_03
    question: "What is the total product category revenue contribution?"
    expected_intent: "category_analysis"
    expected_value: 1258819.00
    description: "Top category canonical revenue"

  - id: cat_04
    question: "Which category has the lowest sales volume in the marketplace?"
    expected_intent: "category_analysis"
    description: "Bottom category inquiry"

  - id: cat_05
    question: "Show category revenue breakdown and percentage share"
    expected_intent: "category_analysis"
    description: "Category share distribution"

  # ----------------------------------------------------------------------------
  # State / Regional Analysis (5 questions)
  # ----------------------------------------------------------------------------
  - id: st_01
    question: "Which Brazilian state generated the most revenue?"
    expected_intent: "state_analysis"
    expected_value: 5041040.67
    description: "Top state (Sao Paulo SP) total revenue"

  - id: st_02
    question: "Show me customer sales distribution across Brazilian states"
    expected_intent: "state_analysis"
    description: "Regional distribution overview"

  - id: st_03
    question: "What percentage of total revenue originates from SP state?"
    expected_intent: "state_analysis"
    expected_value: 38.13
    description: "SP revenue contribution percentage"

  - id: st_04
    question: "How do customer purchases compare between RJ and MG states?"
    expected_intent: "state_analysis"
    description: "State-to-state regional comparison"

  - id: st_05
    question: "Show regional revenue and delivered order counts by state"
    expected_intent: "state_analysis"
    description: "State level volume breakdown"

  # ----------------------------------------------------------------------------
  # Seller Performance Analysis (5 questions)
  # ----------------------------------------------------------------------------
  - id: sel_01
    question: "Who is our top performing seller by gross revenue?"
    expected_intent: "seller_analysis"
    expected_value: 229472.63
    description: "Top marketplace seller gross revenue"

  - id: sel_02
    question: "Which merchant sold the highest number of units in the marketplace?"
    expected_intent: "seller_analysis"
    description: "Seller unit volume"

  - id: sel_03
    question: "Show me the top 10 sellers and their review scores"
    expected_intent: "seller_analysis"
    description: "Seller leaderboard and customer ratings"

  - id: sel_04
    question: "What is the average review score for top performing sellers?"
    expected_intent: "seller_analysis"
    description: "Merchant CSAT performance"

  - id: sel_05
    question: "Rank marketplace merchants and vendors by sales volume"
    expected_intent: "seller_analysis"
    description: "Merchant ranking query"

  # ----------------------------------------------------------------------------
  # Delivery SLA & Logistics (5 questions)
  # ----------------------------------------------------------------------------
  - id: del_01
    question: "What is our on-time delivery rate percentage?"
    expected_intent: "delivery_analysis"
    expected_value: 91.90
    description: "On-time delivery SLA compliance"

  - id: del_02
    question: "What is the average delivery duration in days from order to customer?"
    expected_intent: "delivery_analysis"
    expected_value: 12.50
    description: "Average days to deliver orders"

  - id: del_03
    question: "How many orders suffered shipping delays past estimated delivery date?"
    expected_intent: "delivery_analysis"
    description: "Delayed order count"

  - id: del_04
    question: "How is our logistics delivery SLA performance holding up?"
    expected_intent: "delivery_analysis"
    description: "Logistics health inquiry"

  - id: del_05
    question: "What is the average freight transit time for delivered orders?"
    expected_intent: "delivery_analysis"
    description: "Transit time metrics"

  # ----------------------------------------------------------------------------
  # Payment Method Analysis (5 questions)
  # ----------------------------------------------------------------------------
  - id: pay_01
    question: "What is the most popular payment method among customers?"
    expected_intent: "payment_analysis"
    expected_value: 12542084.19
    description: "Credit card payment gross value"

  - id: pay_02
    question: "How much revenue is paid via credit card versus boleto?"
    expected_intent: "payment_analysis"
    description: "Credit card vs bank slip payment comparison"

  - id: pay_03
    question: "Show payment method distribution breakdown across all orders"
    expected_intent: "payment_analysis"
    description: "Payment channel breakdown"

  - id: pay_04
    question: "What is the percentage of voucher and debit card payments?"
    expected_intent: "payment_analysis"
    description: "Alternative payment method shares"

  - id: pay_05
    question: "What is the average installment count for credit card purchases?"
    expected_intent: "payment_analysis"
    description: "Credit installment behavior"

  # ----------------------------------------------------------------------------
  # Revenue Trends & MoM Growth (5 questions)
  # ----------------------------------------------------------------------------
  - id: trd_01
    question: "What is the monthly revenue trend over time?"
    expected_intent: "revenue_trend"
    expected_value: 1160785.48
    description: "Historical monthly sales trend"

  - id: trd_02
    question: "Show month over month revenue growth rates"
    expected_intent: "revenue_trend"
    description: "MoM growth progression"

  - id: trd_03
    question: "Which month recorded the peak revenue in 2017?"
    expected_intent: "revenue_trend"
    description: "Black Friday 2017-11 sales spike"

  - id: trd_04
    question: "How did monthly order volumes trend between 2017 and 2018?"
    expected_intent: "revenue_trend"
    description: "Multi-year volume trajectory"

  - id: trd_05
    question: "Show seasonal monthly sales pattern and growth trajectory"
    expected_intent: "revenue_trend"
    description: "Seasonality and trend analysis"

  # ----------------------------------------------------------------------------
  # Executive KPIs & Summary (5 questions)
  # ----------------------------------------------------------------------------
  - id: kpi_01
    question: "What is our total gross revenue?"
    expected_intent: "kpi_summary"
    expected_value: 15419773.75
    description: "Total gross revenue (Product + Freight)"

  - id: kpi_02
    question: "What is our total product revenue without freight?"
    expected_intent: "kpi_summary"
    expected_value: 13221498.11
    description: "Canonical total product revenue"

  - id: kpi_03
    question: "How many delivered orders were fulfilled in total?"
    expected_intent: "kpi_summary"
    expected_value: 96478
    description: "Canonical total delivered orders count"

  - id: kpi_04
    question: "What is our average order value (AOV) across delivered orders?"
    expected_intent: "kpi_summary"
    expected_value: 159.83
    description: "Canonical average order value (AOV)"

  - id: kpi_05
    question: "What is our overall customer satisfaction CSAT score?"
    expected_intent: "kpi_summary"
    expected_value: 4.16
    description: "Canonical CSAT average review rating"

  # ----------------------------------------------------------------------------
  # Data Quality & Auditing (5 questions)
  # ----------------------------------------------------------------------------
  - id: dq_01
    question: "Are there any data quality issues in our database?"
    expected_intent: "data_quality"
    description: "General data quality audit check"

  - id: dq_02
    question: "Check primary key uniqueness and duplicate records across tables"
    expected_intent: "data_quality"
    description: "PK uniqueness audit"

  - id: dq_03
    question: "Are there any orphan records or foreign key integrity violations?"
    expected_intent: "data_quality"
    description: "FK referential integrity audit"

  - id: dq_04
    question: "Check domain bounds for negative prices, freight, or invalid review scores"
    expected_intent: "data_quality"
    description: "Domain bounds validation"

  - id: dq_05
    question: "What is our overall database health audit status?"
    expected_intent: "data_quality"
    description: "Audit status summary"

  # ----------------------------------------------------------------------------
  # Anomaly Detection (8 questions)
  # ----------------------------------------------------------------------------
  - id: anom_01
    question: "Are there any unusual revenue spikes or outliers in our sales data?"
    expected_intent: "anomaly_detection"
    expected_value: 176940.50
    description: "Revenue spike detection (Black Friday peak)"

  - id: anom_02
    question: "Did we detect any statistical anomalies or abnormal patterns?"
    expected_intent: "anomaly_detection"
    expected_value: 12.0
    description: "Total anomaly count check"

  - id: anom_03
    question: "Was there a huge sales surge on Black Friday?"
    expected_intent: "anomaly_detection"
    expected_value: 176940.50
    description: "Black Friday surge query"

  - id: anom_04
    question: "Show me abnormal drops or spikes across daily revenue"
    expected_intent: "anomaly_detection"
    expected_value: 176940.50
    description: "Daily revenue anomaly detection"

  - id: anom_05
    question: "Are there any delivery delay outliers or spike anomalies?"
    expected_intent: "anomaly_detection"
    description: "Delivery delay anomaly query"

  - id: anom_06
    question: "Run an anomaly scan for abnormal e-commerce behavior"
    expected_intent: "anomaly_detection"
    description: "General anomaly scan trigger"

  - id: anom_07
    question: "Did any day experience an abnormal dip or surge in orders?"
    expected_intent: "anomaly_detection"
    description: "Order count dip or surge inquiry"

  - id: anom_08
    question: "What are the most severe outlier events in our transaction history?"
    expected_intent: "anomaly_detection"
    expected_value: 176940.50
    description: "Severe outlier investigation"

  # ----------------------------------------------------------------------------
