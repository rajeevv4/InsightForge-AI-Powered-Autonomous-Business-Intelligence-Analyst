# InsightForge Held-Out Dynamic Text-to-SQL Benchmark Dataset
# 20 NEW Dynamic Text-to-SQL Questions (Held-out / Evaluation Set)
# STRICT RULE: Prompts, schema catalog, and validators must NOT be tuned on this set.
# Canonical numbers verified directly on live PostgreSQL (Olist dataset).

questions:
  - id: sql_ho_01
    question: "Total freight revenue generated from delivered orders in Sao Paulo (SP)?"
    reference_sql: "SELECT ROUND(CAST(SUM(oi.freight_value) AS DECIMAL), 2) AS total_freight_revenue FROM orders o JOIN order_items oi ON o.order_id = oi.order_id JOIN customers c ON o.customer_id = c.customer_id WHERE o.order_status = 'delivered' AND c.customer_state = 'SP';"
    expected_column: "total_freight_revenue"
    expected_value: 702069.99
    expected_intent: "text_to_sql"
    description: "Freight revenue for SP state"

  - id: sql_ho_02
    question: "How many delivered orders had a total payment value greater than 1000?"
    reference_sql: "SELECT COUNT(*) AS high_value_orders_count FROM (SELECT o.order_id FROM orders o JOIN order_payments p ON o.order_id = p.order_id WHERE o.order_status = 'delivered' GROUP BY o.order_id HAVING SUM(p.payment_value) > 1000) AS t;"
    expected_column: "high_value_orders_count"
    expected_value: 1107
    expected_intent: "text_to_sql"
    description: "Orders with total payment > 1000"

  - id: sql_ho_03
    question: "What was the total product revenue in the year 2018?"
    reference_sql: "SELECT ROUND(CAST(SUM(oi.price) AS DECIMAL), 2) AS total_product_revenue FROM orders o JOIN order_items oi ON o.order_id = oi.order_id WHERE o.order_status = 'delivered' AND EXTRACT(YEAR FROM o.order_purchase_timestamp) = 2018;"
    expected_column: "total_product_revenue"
    expected_value: 7218125.12
    expected_intent: "text_to_sql"
    description: "Calendar year 2018 product revenue"

  - id: sql_ho_04
    question: "How many unique sellers made delivered sales in the sports_leisure category?"
    reference_sql: "SELECT COUNT(DISTINCT oi.seller_id) AS sports_sellers_count FROM orders o JOIN order_items oi ON o.order_id = oi.order_id JOIN products p ON oi.product_id = p.product_id WHERE o.order_status = 'delivered' AND (p.product_category_name = 'esporte_lazer' OR p.product_category_name_english = 'sports_leisure');"
    expected_column: "sports_sellers_count"
    expected_value: 466
    expected_intent: "text_to_sql"
    description: "Active seller count in sports_leisure"

  - id: sql_ho_05
    question: "What is the average number of items per delivered order?"
    reference_sql: "SELECT ROUND(CAST(AVG(item_count) AS DECIMAL), 2) AS avg_items_per_order FROM view_order_level_summary WHERE order_status = 'delivered';"
    expected_column: "avg_items_per_order"
    expected_value: 1.14
    expected_intent: "text_to_sql"
    description: "Average item count per delivered order"

  - id: sql_ho_06
    question: "Total delivered gross revenue for orders purchased on a weekend (Saturday or Sunday)?"
    reference_sql: "SELECT ROUND(CAST(SUM(gross_order_amount) AS DECIMAL), 2) AS weekend_gross_revenue FROM view_order_level_summary WHERE order_status = 'delivered' AND EXTRACT(DOW FROM order_purchase_timestamp) IN (0, 6);"
    expected_column: "weekend_gross_revenue"
    expected_value: 3513421.37
    expected_intent: "text_to_sql"
    description: "Weekend gross revenue"

  - id: sql_ho_07
    question: "How many delivered orders were paid using debit card?"
    reference_sql: "SELECT COUNT(DISTINCT o.order_id) AS debit_orders_count FROM orders o JOIN order_payments p ON o.order_id = p.order_id WHERE o.order_status = 'delivered' AND p.payment_type = 'debit_card';"
    expected_column: "debit_orders_count"
    expected_value: 1485
    expected_intent: "text_to_sql"
    description: "Debit card order count"

  - id: sql_ho_08
    question: "What is the average freight value across delivered orders in Rio de Janeiro (RJ)?"
    reference_sql: "SELECT ROUND(CAST(AVG(oi.freight_value) AS DECIMAL), 2) AS avg_freight_rj FROM orders o JOIN order_items oi ON o.order_id = oi.order_id JOIN customers c ON o.customer_id = c.customer_id WHERE o.order_status = 'delivered' AND c.customer_state = 'RJ';"
    expected_column: "avg_freight_rj"
    expected_value: 20.91
    expected_intent: "text_to_sql"
    description: "Average freight in RJ state"

  - id: sql_ho_09
    question: "How many unique customers made delivered purchases from Parana (PR)?"
    reference_sql: "SELECT COUNT(DISTINCT c.customer_unique_id) AS unique_customers_pr FROM customers c JOIN orders o ON c.customer_id = o.customer_id WHERE o.order_status = 'delivered' AND c.customer_state = 'PR';"
    expected_column: "unique_customers_pr"
    expected_value: 4769
    expected_intent: "text_to_sql"
    description: "Customer count for PR state"

  - id: sql_ho_10
    question: "Total gross revenue generated by orders in July 2017?"
    reference_sql: "SELECT ROUND(CAST(SUM(gross_order_amount) AS DECIMAL), 2) AS total_gross_revenue FROM view_order_level_summary WHERE order_status = 'delivered' AND order_purchase_timestamp >= '2017-07-01 00:00:00' AND order_purchase_timestamp < '2017-08-01 00:00:00';"
    expected_column: "total_gross_revenue"
    expected_value: 566299.08
    expected_intent: "text_to_sql"
    description: "July 2017 gross revenue"

  - id: sql_ho_11
    question: "What is the maximum freight value recorded for a single order item?"
    reference_sql: "SELECT ROUND(CAST(MAX(freight_value) AS DECIMAL), 2) AS max_freight_value FROM order_items oi JOIN orders o ON oi.order_id = o.order_id WHERE o.order_status = 'delivered';"
    expected_column: "max_freight_value"
    expected_value: 409.68
    expected_intent: "text_to_sql"
    description: "Maximum single freight charge"

  - id: sql_ho_12
    question: "How many delivered orders were delivered before the estimated delivery date?"
    reference_sql: "SELECT COUNT(order_id) AS early_orders_count FROM view_delivery_sla_performance WHERE delivery_status = 'On-Time';"
    expected_column: "early_orders_count"
    expected_value: 88644
    expected_intent: "text_to_sql"
    description: "On-time delivered orders count"

  - id: sql_ho_13
    question: "Total product revenue generated in computers_accessories category?"
    reference_sql: "SELECT ROUND(CAST(SUM(oi.price) AS DECIMAL), 2) AS total_product_revenue FROM orders o JOIN order_items oi ON o.order_id = oi.order_id JOIN products p ON oi.product_id = p.product_id WHERE o.order_status = 'delivered' AND (p.product_category_name = 'informatica_acessorios' OR p.product_category_name_english = 'computers_accessories');"
    expected_column: "total_product_revenue"
    expected_value: 888724.61
    expected_intent: "text_to_sql"
    description: "Computers accessories category revenue"

  - id: sql_ho_14
    question: "What is the average payment installments for orders paid via credit card?"
    reference_sql: "SELECT ROUND(CAST(AVG(payment_installments) AS DECIMAL), 2) AS avg_installments FROM order_payments WHERE payment_type = 'credit_card';"
    expected_column: "avg_installments"
    expected_value: 3.51
    expected_intent: "text_to_sql"
    description: "Average credit card installments"

  - id: sql_ho_15
    question: "How many unique sellers are located in Santa Catarina (SC)?"
    reference_sql: "SELECT COUNT(seller_id) AS seller_count_sc FROM sellers WHERE seller_state = 'SC';"
    expected_column: "seller_count_sc"
    expected_value: 190
    expected_intent: "text_to_sql"
    description: "Seller count in SC state"

  - id: sql_ho_16
    question: "Total product revenue generated by sellers located in Santa Catarina (SC)?"
    reference_sql: "SELECT ROUND(CAST(SUM(oi.price) AS DECIMAL), 2) AS total_product_revenue FROM order_items oi JOIN sellers s ON oi.seller_id = s.seller_id JOIN orders o ON oi.order_id = o.order_id WHERE s.seller_state = 'SC' AND o.order_status = 'delivered';"
    expected_column: "total_product_revenue"
    expected_value: 613591.65
    expected_intent: "text_to_sql"
    description: "Seller revenue in SC state"

  - id: sql_ho_17
    question: "What is the minimum freight value among delivered items?"
    reference_sql: "SELECT ROUND(CAST(MIN(freight_value) AS DECIMAL), 2) AS min_freight_value FROM order_items oi JOIN orders o ON oi.order_id = o.order_id WHERE o.order_status = 'delivered';"
    expected_column: "min_freight_value"
    expected_value: 0.00
    expected_intent: "text_to_sql"
    description: "Minimum freight charge"

  - id: sql_ho_18
    question: "How many orders had payment installments equal to 10?"
    reference_sql: "SELECT COUNT(DISTINCT order_id) AS orders_10_installments FROM order_payments WHERE payment_installments = 10;"
    expected_column: "orders_10_installments"
    expected_value: 5315
    expected_intent: "text_to_sql"
    description: "10-installment order count"

  - id: sql_ho_19
    question: "Total gross revenue generated by delivered orders in the first quarter of 2018 (Jan to Mar)?"
    reference_sql: "SELECT ROUND(CAST(SUM(gross_order_amount) AS DECIMAL), 2) AS q1_gross_revenue FROM view_order_level_summary WHERE order_status = 'delivered' AND order_purchase_timestamp >= '2018-01-01 00:00:00' AND order_purchase_timestamp < '2018-04-01 00:00:00';"
    expected_column: "q1_gross_revenue"
    expected_value: 3164654.11
    expected_intent: "text_to_sql"
    description: "Q1 2018 gross revenue"

  - id: sql_ho_20
    question: "What is the average review score for delivered orders in computers_accessories category?"
    reference_sql: "SELECT ROUND(CAST(AVG(r.review_score) AS DECIMAL), 2) AS avg_review_score FROM orders o JOIN order_items oi ON o.order_id = oi.order_id JOIN products p ON oi.product_id = p.product_id JOIN order_reviews r ON o.order_id = r.order_id WHERE o.order_status = 'delivered' AND (p.product_category_name = 'informatica_acessorios' OR p.product_category_name_english = 'computers_accessories');"
    expected_column: "avg_review_score"
    expected_value: 3.98
    expected_intent: "text_to_sql"
    description: "CSAT in computers accessories"
