name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & AI Evals
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: insightforge
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize PostgreSQL Schema, Views & Roles
        env:
          PGPASSWORD: postgres
        run: |
          for f in database/schema.sql database/views.sql \
                   database/migrations/001_create_datasets_metadata.sql \
                   database/migrations/002_create_dataset_semantic.sql \
                   database/roles.sql; do
            psql -h localhost -U postgres -d insightforge -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Seed Database Sample / Canonical Data
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: insightforge
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_SCHEMA: insightforge
        run: |
          if [ -f data/raw/olist_customers_dataset.csv ]; then
            python database/seed.py
          fi

      - name: Run Backend Unit Tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: insightforge
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_SCHEMA: insightforge
          DB_RO_USER: insightforge_ro
          DB_RO_PASSWORD: insightforge_ro_pass
          USE_FIXTURES: "1"
        run: |
          python -m unittest discover -s backend/tests

      - name: Run AI Feature Evaluation Suite (55 Golden Questions)
        run: |
          python backend/evals/run_eval.py

  frontend-check:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Production Build
        run: npm run build
