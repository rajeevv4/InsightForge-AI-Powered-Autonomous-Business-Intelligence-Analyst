services:
  postgres:
    image: postgres:15-alpine
    container_name: insightforge-postgres
    restart: always
    environment:
      POSTGRES_DB: insightforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/views.sql:/docker-entrypoint-initdb.d/02_views.sql:ro
      - ./database/migrations/001_create_datasets_metadata.sql:/docker-entrypoint-initdb.d/03_datasets_metadata.sql:ro
      - ./database/migrations/002_create_dataset_semantic.sql:/docker-entrypoint-initdb.d/04_dataset_semantic.sql:ro
      - ./database/roles.sql:/docker-entrypoint-initdb.d/05_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d insightforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: insightforge-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=insightforge
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_SCHEMA=insightforge
      - DB_RO_USER=insightforge_ro
      - DB_RO_PASSWORD=insightforge_ro_pass
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-2.5-flash
      - RATE_LIMIT_AI_ASK=30/minute
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insightforge-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
